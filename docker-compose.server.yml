services:
  # Deployment variant for ociub: use the locally built arm64 image (built with
  # docker buildx because the server cannot reach crates.io during image builds).
  app:
    image: mybooks:arm64
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///data/mybooks.db
      PORT: "3000"
    volumes:
      - mybooks_data:/data
    networks: [internal]

  backup:
    image: keinos/sqlite3:latest
    restart: unless-stopped
    volumes:
      - mybooks_data:/data:ro
      - mybooks_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: 'while true; do TS=$$(date +%Y%m%d-%H%M%S); sqlite3 /data/mybooks.db ".backup /backups/mybooks-$$TS.db"; find /backups -name "mybooks-*.db" -mtime +14 -delete; sleep 86400; done'
    networks: [internal]

volumes:
  mybooks_data:
  mybooks_backups:

networks:
  internal:
    external: true
    name: guacamole_internal
