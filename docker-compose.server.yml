services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.binary
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///data/mybooks.db
      PORT: "3000"
    volumes:
      - mybooks_data:/data
    networks: [internal]

  backup:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - mybooks_data:/data:ro
      - mybooks_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: 'apk add --no-cache sqlite >/dev/null && while true; do TS=$$(date +%Y%m%d-%H%M%S); sqlite3 /data/mybooks.db ".backup /backups/mybooks-$$TS.db"; find /backups -name "mybooks-*.db" -mtime +14 -delete; sleep 86400; done'
    networks: [internal]

volumes:
  mybooks_data:
  mybooks_backups:

networks:
  internal:
    external: true
    name: guacamole_internal
