services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///data/mybooks.db
      PORT: "3000"
      APP_BASE_URL: https://mybooks.laurans.org
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    volumes:
      - mybooks_data:/data

  backup:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - mybooks_data:/data:ro
      - mybooks_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: "apk add --no-cache sqlite >/dev/null && while true; do TS=$$(date +%Y%m%d-%H%M%S); sqlite3 /data/mybooks.db \".backup /backups/mybooks-$$TS.db\"; find /backups -name 'mybooks-*.db' -mtime +14 -delete; sleep 86400; done"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mybooks_data:
  mybooks_backups:
  caddy_data:
  caddy_config:
