services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:///data/mybooks.db
      PORT: "3000"
      APP_BASE_URL: https://mybooks.laurans.org
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    volumes:
      - mybooks_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mybooks_data:
  caddy_data:
  caddy_config:
