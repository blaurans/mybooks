{% extends "base.html" %}
{% block title %}Scanner — MyBooks{% endblock %}
{% block content %}
  <div class="card">
    <p>Bonjour <strong>{{ user_name }}</strong>. Scanne le code-barres ISBN d'un livre.</p>
    <video id="preview" playsinline muted style="width:100%;max-width:420px; border:1px solid #e5e7eb; border-radius:.5rem;"></video>
    <div style="margin-top:.5rem; display:flex; gap:.5rem;">
      <button id="startBtn" type="button">Démarrer le scan</button>
      <button id="stopBtn" type="button">Arrêter</button>
    </div>
    <p id="status" style="margin-top:.5rem; color:#555;">Caméra arrêtée.</p>
    <div id="result" style="margin-top:.5rem;"></div>
    <p style="font-size:.85rem; color:#555;">Note : l'accès caméra nécessite HTTPS (ou localhost).</p>
  </div>

  <script>
  (function() {
    const video = document.getElementById('preview');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    let stream = null;
    let scanning = false;

    async function stop() {
      scanning = false;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      status.textContent = 'Caméra arrêtée.';
    }

    async function handleCode(raw) {
      const code = (raw || '').replace(/\s+/g,'');
      status.textContent = 'Code détecté : ' + code;
      result.textContent = 'Recherche des métadonnées…';
      try {
        const metaResp = await fetch('/api/isbn/' + encodeURIComponent(code));
        if (!metaResp.ok) throw new Error(await metaResp.text());
        const meta = await metaResp.json();
        result.textContent = meta.title ? ('Trouvé : ' + meta.title) : 'Métadonnées récupérées';
        const form = new URLSearchParams();
        form.set('isbn', meta.isbn || code);
        const resp = await fetch('/books/from-isbn', { method:'POST', body:form, redirect:'follow' });
        if (resp.ok) {
          window.location.href = resp.url;
        } else {
          throw new Error('ajout échoué (' + resp.status + ')');
        }
      } catch (e) {
        result.textContent = 'Erreur : ' + (e && e.message ? e.message : e);
        window.location.href = '/books/new?isbn=' + encodeURIComponent(code);
      }
    }

    async function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function start() {
      if (scanning) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        status.textContent = 'Caméra non disponible sur ce navigateur.';
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
        video.srcObject = stream;
        await video.play();
        scanning = true;
        status.textContent = 'Scan en cours…';
        runLoop();
      } catch (e) {
        status.textContent = 'Caméra indisponible : ' + (e && e.message ? e.message : e);
      }
    }

    async function runLoop() {
      if (!scanning) return;
      if ('BarcodeDetector' in window) {
        const detector = new BarcodeDetector({ formats: ['ean_13','ean_8','code_128','code_39','qr_code'] });
        await new Promise(r => requestAnimationFrame(r));
        try {
          const codes = await detector.detect(video);
          if (codes && codes.length) {
            await handleCode(codes[0].rawValue);
            return;
          }
        } catch (e) {
          // ignore detection errors
        }
        requestAnimationFrame(runLoop);
      } else {
        try {
          await loadScript('/static/vendor/zxing-browser.js');
          const ZX = window.ZXingBrowser;
          if (!ZX || !ZX.BrowserMultiFormatReader) {
            throw new Error('scanner indisponible');
          }
          const reader = new ZX.BrowserMultiFormatReader();
          const res = await reader.decodeOnceFromVideoDevice(undefined, video);
          const text = res && res.text ? res.text : (res && res.getText ? res.getText() : String(res));
          await handleCode(text);
        } catch (e) {
          status.textContent = 'Erreur de scan : ' + (e && e.message ? e.message : e);
          scanning = false;
        }
      }
    }

    startBtn.addEventListener('click', start);
    stopBtn.addEventListener('click', stop);
  })();
  </script>
{% endblock %}
