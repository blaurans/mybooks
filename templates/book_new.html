{% extends "base.html" %}
{% block title %}Ajouter un livre — MyBooks{% endblock %}
{% block content %}
  <div class="card">
    <h2>Ajouter par ISBN</h2>
    {% if let Some(e) = error %}<p style="color:#b91c1c;">{{ e }}</p>{% endif %}
    <form method="post" action="/books/from-isbn">
      <input type="text" name="isbn" value="" placeholder="ISBN (ex. 9780140328721)" required/>
      <button type="submit">Rechercher & ajouter</button>
    </form>
  </div>

  <div class="card">
    <h2>Ajouter manuellement</h2>
    <p>👷 Astuce : <a href="/scan">Scanner un code-barres avec la caméra</a>.</p>
    <form method="post" action="/books/manual">
      <p><label>Titre *<br/><input type="text" name="title" required/></label></p>
      <p><label>Auteur(s)<br/><input type="text" name="authors"/></label></p>
      <p><label>ISBN<br/><input type="text" name="isbn"/></label></p>
      <p><label>Pages<br/><input type="number" name="pages"/></label></p>
      <p><label>Éditeur<br/><input type="text" name="publisher"/></label></p>
      <p><label>Date de publication<br/><input type="text" name="published_date"/></label></p>
      <p><label>Couverture (URL)<br/><input type="url" name="cover_url"/></label></p>
      <button type="submit">Ajouter</button>
    </form>
  </div>
{% endblock %}
